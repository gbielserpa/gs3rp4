name: CaoPRESS real FFmpeg wasm browser export
on:
  push:
    branches: [gh-pages]
    paths: ['index.html', '.github/workflows/caopress-real.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-wasm-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Install real browser and ffprobe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Verify MP4 MP3 cuts speeds pitch and 30s input via real wasm Chromium
        run: |
          python - <<'PY'
          import http.server, json, subprocess, threading, pathlib, array, sys, math
          from playwright.sync_api import sync_playwright
          BASE=pathlib.Path.cwd()
          OUT=BASE/'test-artifacts';OUT.mkdir(exist_ok=True)
          VIDEO=BASE/'test-input.mp4'
          LONG=BASE/'test-long.mp4'
          def make_video(path,secs,w=160,h=90,fps=10):
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-f','lavfi','-i',f'testsrc2=size={w}x{h}:rate={fps}:duration={secs}','-f','lavfi','-i',f'sine=frequency=440:duration={secs}','-c:v','libx264','-preset','ultrafast','-pix_fmt','yuv420p','-c:a','aac','-b:a','64k','-shortest',str(path)],check=True)
          make_video(VIDEO,6)
          make_video(LONG,30,320,180,10)
          class Handler(http.server.SimpleHTTPRequestHandler):
              def log_message(self,*args):pass
          server=http.server.ThreadingHTTPServer(('127.0.0.1',0),Handler)
          threading.Thread(target=server.serve_forever,daemon=True).start()
          failures=[]
          cases=[
           {'label':'mp4-basico','kind':'mp4','speed':1,'cuts':[],'expected':6},
           {'label':'mp3-basico','kind':'mp3','speed':1,'cuts':[],'expected':6},
           {'label':'mp4-corte-velocidade','kind':'mp4','speed':1.5,'cuts':[(2,4)],'expected':4/1.5},
           {'label':'mp3-corte-velocidade','kind':'mp3','speed':1.5,'cuts':[(2,4)],'expected':4/1.5},
           {'label':'mp4-dois-cortes','kind':'mp4','speed':1,'cuts':[(1,2),(4,5)],'expected':4},
           {'label':'mp3-dois-cortes','kind':'mp3','speed':1,'cuts':[(1,2),(4,5)],'expected':4},
           {'label':'mp4-aceleracao-2x','kind':'mp4','speed':2,'cuts':[],'expected':3},
           {'label':'mp3-aceleracao-2x','kind':'mp3','speed':2,'cuts':[],'expected':3},
           {'label':'mp4-aula-30s','kind':'mp4','speed':1.5,'cuts':[(5,10),(20,25)],'expected':20/1.5,'long':True},
           {'label':'mp3-aula-30s','kind':'mp3','speed':1.5,'cuts':[(5,10),(20,25)],'expected':20/1.5,'long':True},
          ]
          def validate(file,case):
              probe=subprocess.run(['ffprobe','-v','error','-show_entries','format=duration:stream=codec_name,codec_type','-of','json',str(file)],capture_output=True,text=True,check=True)
              meta=json.loads(probe.stdout)
              codecs=[x['codec_name'] for x in meta['streams']]
              if case['kind']=='mp4':assert 'h264' in codecs and 'aac' in codecs,codecs
              else:assert codecs==['mp3'],codecs
              dur=float(meta['format']['duration']);expected=case['expected']
              assert abs(dur-expected)<=0.4,(case['label'],dur,expected)
              subprocess.run(['ffmpeg','-v','error','-i',str(file),'-f','null','-'],capture_output=True,text=True,check=True)
              cmd=['ffmpeg','-v','error','-i',str(file),'-t','0.8','-vn','-ac','1','-ar','8000','-f','s16le','pipe:1']
              signal=subprocess.run(cmd,capture_output=True,check=True).stdout
              pcm=array.array('h');pcm.frombytes(signal[:min(len(signal),12800)])
              if sys.byteorder!='little':pcm.byteswap()
              crossings=sum(1 for a,b in zip(pcm,pcm[1:]) if a<=0<b)
              pitch=crossings/(len(pcm)/8000) if pcm else 0
              assert 390<=pitch<=490,(case['label'],'pitch',pitch)
              print('PASS',case['label'],json.dumps({'duration':dur,'expected_duration':expected,'codecs':codecs,'audio_hz':round(pitch,1)}),flush=True)
          try:
           with sync_playwright() as p:
              b=p.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
              context=b.new_context(accept_downloads=True)
              page=context.new_page()
              page.on('pageerror',lambda e: print('PAGEERROR',str(e),flush=True))
              page.on('requestfailed',lambda r: print('REQUESTFAILED',r.url,r.failure,flush=True))
              page.goto('http://127.0.0.1:%s/index.html'%server.server_address[1])
              loaded=None
              for case in cases:
                  name=case['label']
                  print('TESTING',name,flush=True)
                  try:
                      target=LONG if case.get('long') else VIDEO
                      if loaded!=target:
                          if loaded is not None:
                              page.locator('#change').click()
                          page.locator('#file').set_input_files(str(target))
                          page.wait_for_function('(n)=>document.querySelector("#video").duration>n',arg=(29 if case.get('long') else 5.8),timeout=30000)
                          loaded=target
                      page.locator('#clear').click()
                      page.locator('#format').select_option(case['kind'])
                      if case['speed']==1.5:page.locator('button[data-speed="1.5"]').click()
                      elif case['speed']==2:page.locator('button[data-speed="2"]').click()
                      else:page.locator('button[data-speed="1"]').click()
                      for aa,bb in case['cuts']:
                          page.locator('#start').fill(f'00:{aa:02d}')
                          page.locator('#end').fill(f'00:{bb:02d}')
                          page.locator('#remove').click()
                      expected_ranges=len(case['cuts'])
                      if expected_ranges:
                          assert page.locator('#cuts .cut').count()==expected_ranges
                      with page.expect_download(timeout=110000 if case.get('long') else 50000) as d:
                          page.locator('#export').click()
                      out=OUT/(name+'.'+case['kind']);d.value.save_as(str(out))
                      validate(out,case)
                  except Exception as e:
                      status=page.locator('#status').inner_text()
                      log=page.locator('#log').inner_text()[-7500:]
                      print('FAIL',name,status,log,repr(e),flush=True)
                      page.screenshot(path=str(OUT/('failure-'+name+'.png')))
                      failures.append(name+': '+status+' '+log+' '+repr(e))
              b.close()
          finally:
           server.shutdown()
          if failures:
           (OUT/'failures.txt').write_text('\n'.join(failures))
           raise RuntimeError(f'{len(failures)}/{len(cases)} REAL BROWSER TESTS FAILED')
          print('ALL',len(cases),'REAL BROWSER CASES PASS',flush=True)
          PY
      - name: Capture diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-wasm-evidence
          path: test-artifacts/
